name: Validate

# Runs on every push/PR (when the code changes) plus a weekly drift canary:
# the config flow broke for users not from a code change but from a newer Home
# Assistant tightening schema serialization. The Monday run reinstalls the
# latest HA + deps against the shipped code on the default branch, so a
# dependency-driven break surfaces in CI before a user reports it.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (py${{ matrix.python-version }}, HA ${{ matrix.ha-label }})
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor: minimum supported HA on the minimum supported Python. Guards
          # against accidentally relying on a newer-HA-only API.
          - python-version: "3.12"
            ha-pin: "homeassistant==2025.1.0"
            ha-label: "min"
          # Ceiling: latest HA + deps on a current Python. This is the leg that
          # would have caught issue #8 — a stricter voluptuous_serialize that
          # rejected the old config-flow schema.
          - python-version: "3.14.2"
            ha-pin: ""
            ha-label: "latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements_test.txt
          # Pin to the supported floor on that leg; the unpinned leg keeps the
          # latest HA that requirements_test resolves.
          if [ -n "${{ matrix.ha-pin }}" ]; then
            python -m pip install "${{ matrix.ha-pin }}"
          fi
          python -c "from homeassistant.const import __version__; print('HA', __version__)"

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/eveus/manifest.json >/dev/null
          python -m json.tool custom_components/eveus/strings.json >/dev/null
          python -m json.tool custom_components/eveus/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null

      - name: Compile integration
        run: "python -m compileall custom_components/eveus"

      - name: Lint
        run: "python -m ruff check custom_components/eveus tests tests_ha"

      - name: Run tests
        run: "python -m pytest -q --cov --cov-report=xml --cov-fail-under=90"

      - name: Run Home Assistant smoke tests
        env:
          PYTHONFAULTHANDLER: "1"
        run: >-
          timeout --kill-after=30s 5m
          python -X faulthandler -m pytest -vv -o addopts='' tests_ha

      - name: Set up Node for card tests
        if: matrix.ha-label == 'min'
        uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: "22"

      - name: Run card tests with coverage
        if: matrix.ha-label == 'min'
        run: |
          node --experimental-test-coverage --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage.lcov --test-coverage-include='**/eveus-card.js' tests/card/eveus-card.test.cjs
          grep -q '^SF:.*custom_components/eveus/frontend/eveus-card.js' coverage.lcov

      - name: Upload coverage report
        # One leg only: the floor leg feeds SonarCloud, so two matrix legs can't
        # race to upload the same artifact name.
        if: github.event_name == 'push' && matrix.ha-label == 'min'
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: coverage-xml
          path: |
            coverage.xml
            coverage.lcov
          retention-days: 1

  sonar:
    name: SonarCloud
    needs: test
    # Dependabot branches read the dependabot secret store, where SONAR_TOKEN
    # doesn't exist — the scanner would fail with "Not authorized" on every
    # bump PR. Skip instead of failing.
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          # Full history so SonarCloud can attribute new code and blame lines.
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage report
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: coverage-xml

      - name: SonarCloud scan
        uses: "SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9" # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"

  validate-hacs:
    name: HACS
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: HACS validation
        uses: "hacs/action@d556e736723344f83838d08488c983a15381059a" # 22.5.0
        with:
          category: "integration"

  validate-hassfest:
    name: Hassfest
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-07
