name: Mutation Tests

# Weekly proof that the test suite catches real bugs (not just runs lines).
#
# One mutmut 3 job over the whole package. mutmut 3 imports pytest once, forks
# per mutant and runs only the tests that reach the mutated function, so the
# whole suite is the killer list and a full run takes minutes, not the six
# runner-hours the twelve hand-curated mutmut 2 legs needed. What is mutated,
# which tests are left out and which lines are excused lives in
# `[tool.mutmut]` in pyproject.toml; tests/test_ci_workflow.py keeps it honest.
#
# Report-only gate: a leg is NOT failed just because mutmut's exit code says
# some mutants survived (`continue-on-error` on the run step below). The job
# fails for real only when mutmut produced no usable report (crash, bad
# install) or the survivor count went up against the committed baseline. The
# survivor report is published in full on every run; that is this workflow's
# actual product.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 2"

permissions:
  contents: read

concurrency:
  group: mutation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    name: Mutate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.12 is the supported-floor interpreter Validate already tests.
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements_test.txt
          python -m pip install "mutmut>=3,<4"

      - name: Run mutation tests
        env:
          PYTHONFAULTHANDLER: "1"
        # continue-on-error: mutmut's exit code encodes survived/timeout
        # counts, not crashes — see the report-only-gate note above. A real
        # crash is caught in "Check survivor baseline" instead.
        continue-on-error: true
        run: python -m mutmut run

      - name: Report results
        # Survivor diffs are this workflow's entire product; publish them to
        # the run summary AND to stdout whether the run step passed, failed or
        # timed out. The summary pane is not retrievable through the REST API,
        # so the job log (which is) must carry the same information.
        if: always()
        run: |
          python -m mutmut export-cicd-stats || true
          python -m mutmut results 2>&1 | tee mutmut-results.txt || true
          {
            echo "## Mutation results"
            echo '```'
            cat mutants/mutmut-cicd-stats.json 2>/dev/null || echo "no stats file"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ids=$(sed -n 's/^ *\(.*\): survived$/\1/p' mutmut-results.txt | head -500)
          if [ -n "$ids" ]; then
            for id in $ids; do
              python -m mutmut show "$id" 2>&1 || true
            done | tee mutmut-survivors.txt
            {
              echo "<details><summary>Surviving mutant diffs (first 500)</summary>"
              echo ""
              echo '```diff'
              cat mutmut-survivors.txt
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check survivor baseline (regression ratchet)
        # The report-only gate above never fails on survivor count, so an
        # increase from newly-shipped, untested code would look identical to
        # noise. This step diffs against the committed baseline: an increase
        # FAILS the job, a decrease is a prompt to tighten
        # .github/mutation-baseline.json. An absent or empty stats file means
        # mutmut itself broke, which is also a failure. Failing is safe: this
        # workflow is a weekly cron, never a PR gate.
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import sys

          try:
              stats = json.load(open("mutants/mutmut-cicd-stats.json"))
          except (OSError, ValueError):
              stats = {}
          if not stats.get("total"):
              print("::error::mutmut produced no usable report — treating as a real CI failure, not a survivor count.")
              sys.exit(1)
          survived = stats["survived"]
          baseline = json.load(open(".github/mutation-baseline.json"))["survivors"]
          print(f"survivors={survived} baseline={baseline} (of {stats['total']} mutants; timeouts={stats.get('timeout', 0)})")
          if survived > baseline:
              print(f"::error::survivors increased ({baseline} -> {survived}) — likely new code shipped without a killer test.")
              sys.exit(1)
          if survived < baseline:
              print(f"::notice::survivors decreased ({baseline} -> {survived}) — update .github/mutation-baseline.json to tighten the ratchet.")
          PY
