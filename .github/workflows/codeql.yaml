# GitHub-native security analysis (taint tracking, injection, unsafe deserialization).
# Complements SonarCloud/bandit: CodeQL does interprocedural dataflow they don't.
# Free for public repos; findings land in the Security tab, not as PR noise.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: "github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370" # v4.39.1
        with:
          languages: python
      - uses: "github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370" # v4.39.1
        with:
          category: "/language:python"
