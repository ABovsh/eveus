blueprint:
  name: "Eveus — stop charging on low house battery"
  description: >-
    Stops the car charging with the charger's own Stop command — not by cutting
    its power — once your inverter's battery is low, by its % or by its
    voltage. Fully local; no internet or cloud involved.


    It only stops; add your own automation if you want charging to resume once
    the battery recovers.
  domain: automation
  source_url: https://github.com/ABovsh/eveus/blob/main/blueprints/automation/eveus/stop_on_low_house_battery.yaml
  input:
    stop_mode:
      name: Stop when
      description: >-
        Use voltage if the battery's % drifts.
      default: soc
      selector:
        select:
          mode: list
          options:
            - label: Battery % is low
              value: soc
            - label: Battery voltage is low
              value: voltage
            - label: Either, whichever comes first
              value: either
    battery_soc:
      name: Battery % sensor
      description: Used by "Battery %" and "Either".
      default: ""
      selector:
        entity:
          filter:
            domain: sensor
            device_class: battery
    threshold:
      name: Stop below (%)
      default: 40
      selector:
        number:
          min: 5
          max: 95
          unit_of_measurement: "%"
          mode: slider
    battery_voltage:
      name: Battery voltage sensor
      description: Used by "Battery voltage" and "Either".
      default: ""
      selector:
        entity:
          filter:
            domain: sensor
            device_class: voltage
    voltage_threshold:
      name: Stop below (V)
      description: >-
        Set it near empty: on LiFePO₄ the voltage is flat in the middle. The
        car's load pulls it down, so leave some margin.
      default: 48
      selector:
        number:
          min: 10
          max: 120
          step: 0.1
          unit_of_measurement: "V"
          mode: box
    stop_switch:
      name: The charger's "Stop Charging" switch
      selector:
        entity:
          filter:
            domain: switch
            integration: eveus

mode: single

trigger_variables:
  mode: !input stop_mode
  soc_sensor: !input battery_soc
  soc_limit: !input threshold
  volt_sensor: !input battery_voltage
  volt_limit: !input voltage_threshold

triggers:
  # Held for two minutes so an inrush sag — a well pump, a kettle — cannot end
  # the charging session on its own. A sensor that has no number counts as not
  # low, so an unavailable one never stops the charge. Voltage is converted to
  # volts from the sensor's unit (none means V); a non-voltage unit has no number.
  - trigger: template
    value_template: >-
      {% set soc = states(soc_sensor) if soc_sensor else none %}
      {% set scale = {'V': 1, 'mV': 0.001, 'μV': 0.000001, 'µV': 0.000001, 'kV': 1000, 'MV': 1000000} %}
      {% set unit = (state_attr(volt_sensor, 'unit_of_measurement') if volt_sensor else none) or 'V' %}
      {% set raw = states(volt_sensor) if volt_sensor else none %}
      {% set volt = (raw | float) * scale[unit] if is_number(raw) and unit in scale else none %}
      {% set soc_low = mode in ['soc', 'either'] and is_number(soc)
         and soc | float < soc_limit | float %}
      {% set volt_low = mode in ['voltage', 'either'] and volt is not none
         and volt < volt_limit | float %}
      {{ soc_low or volt_low }}
    for: "00:02:00"

actions:
  - action: switch.turn_on
    target:
      entity_id: !input stop_switch
