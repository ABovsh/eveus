# Gitleaks configuration — default ruleset plus this project's allowlist.
# Credentials never live in source here: the charger's user/password come from
# the HA config entry at runtime. The entries below are the recurring shapes
# that trip gitleaks' generic-api-key entropy check.

[extend]
useDefault = true

[allowlist]
description = "Home Assistant entity keys and documentation placeholders"
regexTarget = "line"
regexes = [
  # Entity/state keys in platform definitions: key="voltage_phase_2",
  # state_key="sh1EnergyEnable". Identifiers, not secrets.
  '''(state_)?key\s*=\s*"[A-Za-z][A-Za-z0-9_]{2,48}"''',
  # Placeholder credentials in docs and test docstrings. Deliberately narrow:
  # README is still scanned, so a real token pasted there is still caught.
  '''USER:PASS''',
  '''real_login:real_password''',
  '''-u wrong:wrong''',
  '''CHARGER_IP''',
]
